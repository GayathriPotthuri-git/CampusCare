<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — CampusCare</title>
  <link rel="stylesheet" href="landing.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    .dashboard-wrapper { max-width: 1100px; margin: 100px auto 40px; padding: 0 20px; }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 30px;
    }
    .stat-card {
      background: white; padding: 24px 20px;
      border-radius: 16px; text-align: center;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      position: relative; overflow: hidden; transition: transform 0.2s;
    }
    .stat-card::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 4px;
    }
    .stat-card.total::before   { background: linear-gradient(135deg, #0ea5e9, #10b981); }
    .stat-card.pending::before { background: #f59e0b; }
    .stat-card.progress::before{ background: #3b82f6; }
    .stat-card.resolved::before{ background: #10b981; }
    .stat-card:hover { transform: translateY(-3px); }
    .stat-card .icon { font-size: 28px; margin-bottom: 8px; }
    .stat-card h3 { font-size: 40px; font-weight: 800; margin-bottom: 4px; }
    .stat-card.total h3   { color: #0ea5e9; }
    .stat-card.pending h3 { color: #f59e0b; }
    .stat-card.progress h3{ color: #3b82f6; }
    .stat-card.resolved h3{ color: #10b981; }
    .stat-card p { font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Charts */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px; margin-bottom: 30px;
    }
    @media (max-width: 700px) { .charts-grid { grid-template-columns: 1fr; } }
    .chart-card {
      background: white; border-radius: 16px; padding: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }
    .chart-card h3 {
      font-size: 14px; font-weight: 700; color: #0f172a;
      margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .chart-container { position: relative; height: 220px; }

    /* Section title */
    .section-title {
      font-size: 16px; font-weight: 700; color: #0f172a;
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }

    /* Complaint cards */
    .complaint-card {
      background: white; border-radius: 14px; padding: 20px;
      margin-bottom: 12px; border: 1px solid #e2e8f0;
      border-left: 4px solid #0ea5e9;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      transition: all 0.2s;
    }
    .complaint-card:hover { transform: translateX(4px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
    .complaint-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .complaint-category {
      background: linear-gradient(135deg, #0ea5e9, #10b981);
      color: white; padding: 3px 12px;
      border-radius: 20px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .complaint-status { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .status-pending     { background: #fef3c7; color: #d97706; }
    .status-in-progress { background: #dbeafe; color: #2563eb; }
    .status-resolved    { background: #dcfce7; color: #16a34a; }
    .complaint-info { margin: 6px 0; color: #475569; font-size: 14px; line-height: 1.5; }
    .complaint-info strong { color: #0f172a; font-weight: 600; }
    .complaint-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-action {
      padding: 7px 16px; border: none; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: 'Inter', sans-serif; transition: all 0.2s;
    }
    .btn-inprogress { background: #dbeafe; color: #2563eb; }
    .btn-inprogress:hover { background: #bfdbfe; }
    .btn-resolved { background: #dcfce7; color: #16a34a; }
    .btn-resolved:hover { background: #bbf7d0; }

    /* Timeline */
    .timeline {
      display: flex; align-items: center; gap: 0;
      margin-top: 12px; padding-top: 12px;
      border-top: 1px dashed #e2e8f0;
    }
    .timeline-step {
      display: flex; flex-direction: column; align-items: center;
      flex: 1; position: relative;
    }
    .timeline-step:not(:last-child)::after {
      content: ''; position: absolute;
      top: 10px; left: 50%; width: 100%; height: 2px;
      background: #e2e8f0; z-index: 0;
    }
    .timeline-step.done:not(:last-child)::after { background: #10b981; }
    .timeline-dot {
      width: 20px; height: 20px; border-radius: 50%;
      background: #e2e8f0; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
    }
    .timeline-step.done .timeline-dot { background: #10b981; color: white; }
    .timeline-step.current .timeline-dot { background: #0ea5e9; color: white; }
    .timeline-label { font-size: 10px; color: #94a3b8; margin-top: 4px; font-weight: 600; text-align: center; }
    .timeline-step.done .timeline-label { color: #10b981; }
    .timeline-step.current .timeline-label { color: #0ea5e9; }

    /* Empty state */
    .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
    .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }

    /* Admin badge */
    .admin-badge {
      display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; padding: 2px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700; margin-left: 8px;
    }

    /* Filter bar */
    .filter-bar {
      display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 16px; border-radius: 20px; border: 2px solid #e2e8f0;
      background: white; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif;
      color: #64748b;
    }
    .filter-btn.active { border-color: #0ea5e9; background: #0ea5e9; color: white; }
    .filter-btn:hover:not(.active) { border-color: #0ea5e9; color: #0ea5e9; }

    .page-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .page-header h1 { font-size: 24px; font-weight: 800; color: #0f172a; }
    .page-header p { color: #64748b; font-size: 14px; margin-top: 4px; }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="nav-container">
    <div class="logo">🏛️ CampusCare</div>
    <div class="nav-links" id="navLinks">
      <a href="landing.html">Home</a>
      <a href="announcements.html">Announcements</a>
      <a href="authorities.html">Authorities</a>
      <a href="index.html">Report Issue</a>
    </div>
  </div>
</nav>

<div class="dashboard-wrapper">

  <!-- Header -->
  <div class="page-header">
    <div>
      <h1>📊 Dashboard <span class="admin-badge" id="roleBadge" style="display:none"></span></h1>
      <p id="dashSubtitle">View and manage complaints</p>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card total">
      <div class="icon">📋</div>
      <h3 id="totalCount">0</h3>
      <p>Total</p>
    </div>
    <div class="stat-card pending">
      <div class="icon">⏳</div>
      <h3 id="pendingCount">0</h3>
      <p>Pending</p>
    </div>
    <div class="stat-card progress">
      <div class="icon">🔧</div>
      <h3 id="inProgressCount">0</h3>
      <p>In Progress</p>
    </div>
    <div class="stat-card resolved">
      <div class="icon">✅</div>
      <h3 id="resolvedCount">0</h3>
      <p>Resolved</p>
    </div>
  </div>

  <!-- Charts (admin only) -->
  <div class="charts-grid" id="chartsSection" style="display:none">
    <div class="chart-card">
      <h3>📊 Complaints by Category</h3>
      <div class="chart-container">
        <canvas id="categoryChart"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <h3>🔵 Status Overview</h3>
      <div class="chart-container">
        <canvas id="statusChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Complaints List -->
  <div class="section-title">🗂️ Complaints</div>

  <!-- Filter bar -->
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" onclick="filterComplaints('all', this)">All</button>
    <button class="filter-btn" onclick="filterComplaints('pending', this)">⏳ Pending</button>
    <button class="filter-btn" onclick="filterComplaints('in-progress', this)">🔧 In Progress</button>
    <button class="filter-btn" onclick="filterComplaints('resolved', this)">✅ Resolved</button>
  </div>

  <div id="complaintsContainer"></div>
</div>

<script src="dashboard.js"></script>
<script src="firebase-init.js"></script>
<script src="chatbot.js"></script>
</body>
</html>
